<script>
(() => {
  'use strict';
  // Remove referral tracking without disturbing other query parameters or anchors.
  try {
    const clean = new URL(window.location.href);
    let changed = false;
    for (const key of Array.from(clean.searchParams.keys())) {
      if (/^utm_/i.test(key)) { clean.searchParams.delete(key); changed = true; }
    }
    if (changed) history.replaceState(history.state, '', clean.pathname + clean.search + clean.hash);
  } catch (_) { /* A tracking parameter must never block login. */ }
  const API = 'https://studywithdev-api.mdevaansh-592.workers.dev/api';
  const actions = new Set(['loadStudyPage','loadStudyState','saveStudyState','listLearnerData','downloadNotesPdf']);
  async function call(action, args) {
    if (!actions.has(action)) throw new Error('Unsupported action.');
    const response = await fetch(API, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,args}),credentials:'omit',cache:'no-store',redirect:'error'});
    let result;
    try { result = await response.json(); } catch { throw new Error('The API returned an invalid response.'); }
    if (!response.ok || !result || result.ok !== true) throw new Error(result?.error || 'Could not connect to the study server.');
    return result.data;
  }
  // Match the existing portal's Apps Script RPC interface without publishing the curriculum or secrets.
  function runner(success, failure) {
    const bridge = {
      withSuccessHandler(fn) { return runner(fn, failure); },
      withFailureHandler(fn) { return runner(success, fn); }
    };
    for (const name of actions) {
      bridge[name] = (...args) => { call(name,args).then(v => { if(typeof success==='function') success(v); }, e => { if(typeof failure==='function') failure(e); }); };
    }
    return bridge;
  }
  function installPortal(html) {
    if (typeof html !== 'string' || html.length > 8000000) throw new Error('The study content response is invalid.');
    const parsed = new DOMParser().parseFromString(html,'text/html');
    if (!parsed.getElementById('memberLogin') || !parsed.getElementById('memberEmail') || !parsed.getElementById('memberKey') || !parsed.getElementById('memberSubmit') || !parsed.getElementById('studyPayload')) throw new Error('The API did not return the expected study portal. Contact the owner.');
    const scripts = Array.from(parsed.querySelectorAll('script'));
    if (!scripts.length || scripts.some(s => s.hasAttribute('src'))) throw new Error('Unsupported study portal script format. Contact the owner.');
    // The Apps Script HTML is our own authenticated application. Parse it in an inert document,
    // install its existing interface, then run the inline scripts in the original order.
    window.google = {script:{run:runner()}};
    document.documentElement.lang = parsed.documentElement.lang || 'en';
    const devIcon = document.getElementById('devFavicon').cloneNode(true);
    document.head.replaceChildren(...Array.from(parsed.head.childNodes));
    document.head.querySelectorAll('link[rel~="icon"]').forEach(link => link.remove());
    document.head.append(devIcon);
    document.body.replaceChildren(...Array.from(parsed.body.childNodes));
    const brand = document.querySelector('.brand');
    if (brand) {
      const logo = document.createElement('img');
      logo.src = devIcon.href;
      logo.alt = 'Dev logo';
      logo.width = 52; logo.height = 52;
      logo.style.cssText = 'display:block;border-radius:10px;margin-bottom:12px;object-fit:contain';
      brand.prepend(logo);
    }
    // Preserve the browser URL. No iframe or navigation to the Apps Script endpoint is necessary.
    for (const old of Array.from(document.querySelectorAll('script'))) {
      const fresh = document.createElement('script');
      for (const attr of old.attributes) fresh.setAttribute(attr.name,attr.value);
      fresh.textContent = old.textContent;
      old.replaceWith(fresh);
    }
  }
  function ready(timeout=20000) {
    return new Promise((resolve,reject) => {
      const start = Date.now();
      const id = setInterval(() => {
        if (window.__studyReady === true) {clearInterval(id); resolve();}
        else if (Date.now()-start > timeout) {clearInterval(id); reject(new Error('The study portal did not finish loading. Refresh and try again.'));}
      },50);
    });
  }
  const form = document.getElementById('entryForm');
  const status = document.getElementById('entryStatus');
  const button = document.getElementById('entrySubmit');
  let busy = false;
  form.addEventListener('submit',async e => {
    e.preventDefault(); if (busy) return; busy = true;
    let email = document.getElementById('entryEmail').value.trim().toLowerCase();
    let passkey = document.getElementById('entryKey').value.trim();
    button.disabled = true; status.classList.remove('error'); status.textContent = 'Checking access and opening your study portal…';
    let installed = false;
    try {
      const result = await call('loadStudyPage',[email,passkey]);
      // The backend first validates the user's key before returning any study content.
      installPortal(result?.html); installed = true;
      await ready();
      const gate = document.getElementById('memberGate');
      let opened = false;
      const observer = new MutationObserver(() => {
        if (gate.hidden) opened = true;
        else if (opened) {observer.disconnect(); location.replace(location.pathname);}
      });
      observer.observe(gate,{attributes:true,attributeFilter:['hidden']});
      document.getElementById('memberEmail').value = email;
      document.getElementById('memberKey').value = passkey;
      document.getElementById('memberLogin').requestSubmit();
      // The existing application now authenticates and loads its state, using the API bridge.
    } catch (err) {
      const message = err?.message || 'Unable to open the portal.';
      if (installed || !form.isConnected) {
        const target = document.getElementById('loginStatus');
        if (target) target.textContent = message;
        const back = document.createElement('a'); back.textContent = 'Return to login'; back.href = location.pathname;
        if(target) target.after(back); else document.body.append(back);
      } else { status.textContent = message; status.classList.add('error'); }
    } finally {
      email = ''; passkey = '';
      if (form.isConnected) {button.disabled = false; busy = false;}
    }
  });
})();
</script>
</body>
</html>
